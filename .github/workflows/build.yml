name: Build and deploy site
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.gitignore'
      - 'README.md'
  # The download links are fetched from the latest SS3D game release at build
  # time, so rebuild regularly to pick up new releases without a commit here.
  schedule:
    - cron: '0 */6 * * *'
  # Manual rebuild from the Actions tab.
  workflow_dispatch:
  # Lets the game repo trigger an immediate rebuild after publishing a release:
  #   POST /repos/RE-SS3D/SS3D-Website/dispatches  {"event_type": "game-release"}
  repository_dispatch:
    types: [game-release]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.17.2
      - name: Build site
        run: zola build
        env:
          # Authenticates the GitHub API call for the latest release (higher rate limit).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix permissions
        run: |
          chmod -c -R +rX "public/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public/"
  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
